<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thirukkural App</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <h1>Thirukkural App</h1>
        

        <form method="GET">

            <input
                type="number"
                name="number"
                min="1"
                max="1330"
                placeholder="Enter Kural number"
                required
            >

            <button type="submit">Search</button>

        </form>

        <div class="card">

            <h2>Kural {{ kural.number }}</h2>

            <h3>{{ kural.chapter }}</h3>

            <p class="tamil">
                {{ kural.kural[0] }}<br>
                {{ kural.kural[1] }}
            </p>

            <hr>

            <p>
                <b>English Meaning:</b>
            </p>

            <p>{{ kural.meaning.en }}</p>

        </div>

    </div>

</body>

</html>
